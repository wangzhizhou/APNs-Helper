name: Docs

# 文档与代码同仓库维护：DocC 源在 "APNs Helper Doc/docs.docc"，
# 这里构建静态站并部署到 GitHub Pages（项目站点 /APNs-Helper/）。
#
# 前置（仓库 Settings 一次性设置）：
#   Settings → Pages → Build and deployment → Source = GitHub Actions
#   （私有仓库使用 Pages 需要付费计划，因此仓库需为 public）

on:
  push:
    branches: [main]
    paths:
      - "APNs Helper Doc/docs.docc/**"
      - "APNs Helper/**"
      - "Common/**"
      - "Scripts/build-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build documentation site
        run: ./Scripts/build-docs.sh /APNs-Helper dist/docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库已公开；首次运行时自动启用 Pages（等价于 Settings → Pages → Source: GitHub Actions）
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/docs

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
