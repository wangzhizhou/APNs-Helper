name: Build & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: APNs Helper.xcodeproj
  SCHEME: APNs Helper
  TEST_SCHEME: APNs Helper Tests

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: ./Scripts/lint.sh

  build:
    name: Build (${{ matrix.name }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: platform=macOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"
      - name: Show resolved packages
        run: |
          python3 -c "
          import json
          d = json.load(open('APNs Helper.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'))
          print('locked packages:', len(d['pins']))
          [print('  ', p['identity'], p['state'].get('version')) for p in sorted(d['pins'], key=lambda p: p['identity'])]
          "
      - name: Build
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  test:
    name: Unit Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run tests
        run: |
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$TEST_SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
